title: Suspicious Encoded PowerShell Execution
id: 7c3f1a2e-2b4d-4e1a-9f5b-1a2b3c4d5e6f
status: experimental
description: |
    Detects PowerShell execution using the -EncodedCommand (or -enc) flag, a common
    technique used by attackers to obfuscate malicious commands and evade simple
    string-based detections and logging.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Anxuan
date: 2026-08-10
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027

logsource:
    category: process_creation
    product: windows

detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_flag:
        CommandLine|contains:
            - '-enc'
            - '-EncodedCommand'
            - '-e '
    condition: selection_img and selection_flag

falsepositives:
    - Legitimate admin scripts that use encoded commands for scheduled task payloads.
      Baseline your environment before setting this to high confidence.

level: high
